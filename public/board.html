let dlNS;
async function saveFile(name,blob){
 try{if(window.claude&&window.claude.use){if(dlNS===undefined)dlNS=await window.claude.use('downloads');if(dlNS){await dlNS.save({filename:name,data:blob});toast('Gemt: '+name);return}}}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited')return toast('Vent et øjeblik og prøv igen')}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('Hentet: '+name)}catch(e){toast('Filen kunne ikke gemmes her')}}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
files.forEach(f=>{const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
 const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
 parts.push(new Uint8Array(h.buffer),name,data);
 const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
 cd.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length});
const cdSize=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
return new Blob(parts.concat(cd,[new Uint8Array(e.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function sheetXML(rows,widths){const col=i=>String.fromCharCode(65+i);
return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=col(ci)+(ri+1),st=ri===0?' s="1"':'';return typeof v==='number'&&isFinite(v)?`<c r="${ref}"${st}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v)}</t></is></c>`}).join('')}</row>`).join('')}</sheetData><autoFilter ref="A1:${col(rows[0].length-1)}${rows.length}"/></worksheet>`}
function makeXlsx(sheets){const files=[
 {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
 {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
 {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>${sheets.map((s,i)=>`<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xe(s.name)}'!$A$1:$${String.fromCharCode(64+s.rows[0].length)}$${s.rows.length}</definedName></definedNames>`).slice(0,0).join('')}</workbook>`},
 {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
 {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF141B2D"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`}]
 .concat(sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXML(s.rows,s.widths)})));
return zipStore(files)}
const stamp=()=>new Date().toISOString().slice(0,10);
function exportXlsx(){const rows=hRows();if(!rows.length)return toast('Ingen kampe at eksportere');
const k=[['Dato','Sport','Turnering / event','Spillere / hold','Resultat','Vinder','Sidst','Status']].concat(rows.map(h=>[fmtDate(h.at),sportName(h.mode),h.tour||'',h.sides.map(sdName).join(' vs. '),hResult(h),h.winner||(h.live?'':h.aborted?'':'Uafgjort'),h.loser||'',hStatus(h)]));
const sp=[['Dato','Turnering / event','Sport','Spiller','Hold','Point','Skæver','Vandt','Sidst','Placering']];
rows.forEach(h=>h.sides.forEach(s=>((s.pids&&s.pids.length)?s.pids:(s.names||[])).forEach((x,i)=>{const pid=s.pids&&s.pids.length?x:null;sp.push([fmtDate(h.at),h.tour||'',sportName(h.mode),(s.names||[])[i]||(pid?fullName(P(pid)):x),s.team||'',s.score,pid?((s.sk||{})[pid]||0):0,s.won?'Ja':'Nej',s.last?'Ja':'Nej',s.place||''])})));
const ph=[['Kamp (dato)','Turnering / event','Spiller / hold','Pointændring','Gammel score','Ny score','Tidspunkt','Registreret af','Note']];rows.forEach(h=>(h.plog||[]).forEach(e=>ph.push([fmtDate(h.at),h.tour||'',e.name,e.d,e.old,e.nw,new Date(e.at).toLocaleString('da-DK'),e.user||'',e.undo?'Fortrydelse':e.undone?'Fortrudt':e.foul?'Skæve (fejlstød)':''])));
saveFile(`banditboard-historik-${stamp()}.xlsx`,makeXlsx([{name:'Kampe',rows:k,widths:[18,18,24,44,16,24,20,12]},{name:'Spillere',rows:sp,widths:[18,24,18,26,20,9,9,8,8,11]},{name:'Pointhistorik',rows:ph,widths:[18,22,26,13,13,11,20,18,18]}]))}
function exportPdf(){const rows=hRows();if(!rows.length)return toast('Ingen kampe at eksportere');
const f=[];if(hfl.tour!=='all')f.push('Turnering: '+hfl.tour);if(hfl.sport!=='all')f.push(sportName(hfl.sport));if(hfl.status!=='all')f.push(hfl.status);if(hfl.q)f.push('Søgning: '+hfl.q);if(hfl.per==='custom')f.push((hfl.from||'…')+' – '+(hfl.to||'…'));
let el=$('#print');if(!el){el=document.createElement('div');el.id='print';document.body.appendChild(el)}
el.innerHTML=`<h1>${esc(S.settings.venue)} – historik & resultater</h1><p>Udskrevet ${fmtDate(Date.now())}${f.length?' · '+esc(f.join(' · ')):''} · ${rows.length} kampe</p>
<table><thead><tr><th>Dato</th><th>Sport</th><th>Turnering / event</th><th>Spillere / hold</th><th>Resultat</th><th>Status</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${fmtDate(h.at)}</td><td>${sportName(h.mode)}</td><td>${h.table?`<span class="tst">${esc(h.table)}</span> `:''}${esc(h.tour||'–')}</td><td>${h.sides.map(s=>s.won?`<b>${esc(sdName(s))}</b>`:esc(sdName(s))).join(' vs. ')}</td><td>${hResult(h)}</td><td>${hStatus(h)}</td></tr>`).join('')}</tbody></table>`;
document.body.classList.add('printing');setTimeout(()=>{try{window.print()}catch(e){toast('Udskrift er ikke tilladt her')}setTimeout(()=>document.body.classList.remove('printing'),500)},50);
logA('Eksporterede historik som PDF',rows.length+' kampe')}

function mediaCard(f,cat){const m=M(),isClub=m.club===f.path,isBand=m.band===f.path,isSp=m.sponsors.includes(f.path);
const roles=cat==='logoer'?['club']:cat==='sponsorer'?['spon']:(cat==='baand'||cat==='baggrunde')?['band']:['club','spon','band'];
const b=(r,on,l)=>`<button class="mrole ${on?'on':''}" data-act="mrole" data-k="${r}" data-v="${esc(f.path)}">${on?'✓ ':''}${l}</button>`;
return `<div class="mcard ${isClub||isBand||isSp?'sel':''}"><div class="mimg ${cat==='baand'||cat==='baggrunde'?'wide':''}"><img src="${f.url}" alt="${esc(f.name)}" loading="lazy"></div><div class="mname" title="${esc(f.name)}">${esc(f.name)}</div>
<div class="mroles">${roles.includes('club')?b('club',isClub,'Klublogo'):''}${roles.includes('spon')?b('spon',isSp,'Sponsorbånd'):''}${roles.includes('band')?b('band',isBand,'Bånd-baggrund'):''}</div>
${(typeof mediaReadonly!=='undefined'&&mediaReadonly)?'':`<div class="macts"><label class="mlink">Udskift<input type="file" accept="image/*" data-mrep="${esc(f.path)}"></label><button class="mlink danger" data-act="mdel" data-v="${esc(f.path)}">Slet</button></div>`}</div>`}
function viewMedia(){
const list=medier||[];
mediaReadonly=net!=='live';
if(!list.length)return `<div class="empty"><h1>Medier</h1><p>Mediebiblioteket med logoer, sponsorer og bånd hentes fra BanditBoard. Hvis det ikke vises endnu, så genindlæs siden.</p></div>`;
if(!msport||!list.some(s=>s.name===msport))msport=(list.find(s=>s.name==='billard')||list[0]||{}).name;
const sp=list.find(s=>s.name===msport),m=M();
const chosen=(p,l)=>{const u=mediaUrl(p);return `<div class="mchosen"><span>${l}</span>${u?`<img src="${u}" alt="">`:'<em>Ingen valgt</em>'}</div>`};
return `<div class="phead"><h1>Medier</h1>${mediaReadonly?'':`<button class="btn" data-act="mopen">Åbn mappen på computeren</button><button class="btn" data-act="mnew">Ny sportsgren</button>`}</div>
<p class="mut">${mediaReadonly?'Vælg klublogo, bånd og sponsorer fra biblioteket. Valget gemmes på jeres konto og følger med på TV og telefon. Egne sponsorlogoer kan også lægges ind under Indstillinger.':'Filerne ligger i mappen <b>public/medier/'+esc(msport||'')+'</b>. Læg nye billeder i mapperne, eller brug knapperne her – ændringer vises automatisk på alle skærme.'}</p>
<section class="card sysbrand"><div><h2>Systemlogo – BanditBoard Live</h2><p class="mut">Vises i toppen, på TV/storskærm, login og mobil. Ligger i mappen <b>branding</b> som <b>logo.png</b> (eller .svg/.webp). Logoet vises præcis som filen er – uden beskæring eller farveændring.</p>${mediaReadonly?'':`<label class="btn sm mup" style="margin-top:10px">Udskift systemlogo<input type="file" accept="image/png,image/svg+xml,image/webp,image/jpeg" data-brandup="1"></label>`}</div><div class="sysprev">${brandMark('prev')}</div></section>
<div class="mnow card">${chosen(m.club,'Klublogo')}${chosen(m.band,'Bånd-baggrund')}<div class="mchosen"><span>Sponsorbånd</span><div class="mspons">${m.sponsors.map(mediaUrl).filter(Boolean).map(u=>`<img src="${u}" alt="">`).join('')||'<em>Tekst fra Indstillinger</em>'}</div></div>${m.club||m.band||m.sponsors.length?'<button class="btn sm ghost" data-act="mclear">Ryd valg</button>':''}</div>
<div class="seg" style="margin:14px 0">${list.map(s=>`<button class="${s.name===msport?'on':''}" data-act="msport" data-v="${esc(s.name)}">${esc(sportLabel(s.name))}</button>`).join('')}</div>
${sp?Object.keys(sp.cats).filter(c=>c!=='designs'&&c!=='sponsorboards').map(c=>`<section class="mcat"><div class="ch"><h2>${esc(catLabel(c))}</h2><span class="mut">${sp.cats[c].length} filer</span>${mediaReadonly?'':`<label class="btn sm mup">+ Tilføj billeder<input type="file" accept="image/*" multiple data-mup="${esc(sp.name+'/'+c)}"></label>`}</div>
<div class="mgrid">${sp.cats[c].map(f=>mediaCard(f,c)).join('')||`<p class="mut">Tom mappe – tilføj billeder eller læg dem i <b>public/medier/${esc(sp.name)}/${esc(c)}</b>.</p>`}</div></section>`).join(''):'<p class="mut">Ingen sportsgrene i mappen endnu.</p>'}`}
async function mUpload(files,sport,cat,replace){let last=null;for(const f of files){if(!/\.(png|jpe?g|webp|svg|gif)$/i.test(f.name)){toast(f.name+' er ikke et billede');continue}
 try{const r=await fetch(`/api/medier/upload?sport=${encodeURIComponent(sport)}&cat=${encodeURIComponent(cat)}&name=${encodeURIComponent(f.name)}${replace?'&replace='+encodeURIComponent(replace):''}`,{method:'POST',body:f});
  const j=await r.json();if(!r.ok)throw new Error(j.error||'fejl');last=j.path;logA(replace?'Udskiftede billede':'Tilføjede billede',j.path);
  if(replace&&j.path!==replace){const m=M();if(m.club===replace)m.club=j.path;if(m.band===replace)m.band=j.path;m.sponsors=m.sponsors.map(x=>x===replace?j.path:x);save()}}
 catch(e){toast('Kunne ikke gemme '+f.name+': '+e.message)}}
 if(last){toast(replace?'Billedet er udskiftet':'Billeder tilføjet');try{medier=await (await fetch('/api/medier')).json()}catch(e){}render()}}

// Konfigurerbar pointmotor: værdierne ligger i S.settings.points og kan ændres under Indstillinger → Pointmotor.
const POINT_DEFAULTS=[2,4,6,8,10,12,14,16,-2,-4,-6,-8,-10,-12,-14,-16];
function pointEngine(){let l=S.settings.points;if(!Array.isArray(l)||!l.length)l=POINT_DEFAULTS.map(v=>({v,on:true}));
 return {all:l,pos:l.filter(x=>x.on&&x.v>0).map(x=>x.v).sort((a,b)=>a-b),neg:l.filter(x=>x.on&&x.v<0).map(x=>x.v).sort((a,b)=>b-a)}}
function plogAdd(g,s,d,old,nw,extra){g.plog=g.plog||[];extra=extra||{};const pid=extra.playerId||(s.pids[(s.cur||0)%s.pids.length]);
 if(!extra.foul){s.pscore=s.pscore||{};s.pscore[pid]=(s.pscore[pid]||0)+(extra.sc!=null?extra.sc:d)}
 g.plog.push(Object.assign({id:uid(),sid:s.id,name:sideName(s),playerId:pid,playerName:extra.foul?'':fullName(P(pid)),d,old,nw,at:Date.now(),user:S.settings.operator||'Ukendt'},extra))}

 pushUndo();const old=s.score;s.score=old+v;s.rounds.push(v);s.feed.push({t:fmtDelta(v),c:v<0?'n':''});plogAdd(g,s,v,old,s.score,opt&&opt.manual?{manual:true}:undefined);
 logA('Registrerede '+fmtDelta(v)+' point',`${sideName(s)} (${old} → ${s.score})`);

 save();render()}
function undoPoint(g){const e=[...(g.plog||[])].reverse().find(x=>!x.undone&&!x.undo);if(!e)return toast('Ingen point at fortryde');if(e.grp)return undoGroup(g,e.grp);const s=side(g,e.sid);if(!s)return;
 pushUndo();if(g.over){g.over=false;g.winner=null;g.loser=null;S.history=S.history.filter(h=>h.gid!==g.id)}
 const old=s.score;s.score=old-e.d;if(!e.foul&&s.rounds.length)s.rounds.pop();s.feed.push({t:'Fortrudt '+fmtDelta(e.d),c:'n'});e.undone=true;
 plogAdd(g,s,-e.d,old,s.score,{undo:true,playerId:e.playerId});
 if(s.place&&!(g.target>0&&s.score>=g.target))unlockSide(g,s);
 if(!s.place)setActive(g,g.sides.indexOf(s),s.pids.indexOf(e.playerId)>=0?s.pids.indexOf(e.playerId):null);
 logA('Fortrød point',`${fmtDelta(e.d)} på ${sideName(s)} (${old} → ${s.score})`);toast(`Fortrudt ${fmtDelta(e.d)} – ${sideName(s)} har ${s.score}`);save();render()}

/* ================= DART-MODUL =================
   Dart501: ren spillogik (ingen UI). Klar til flere varianter (301, Cricket, Killer …) senere.
   Regler: straight-in, double-out. Bull (50) tæller som double. Bust = visit annulleres. */
const Dart501=(()=>{
 const BOGEY=[169,168,166,165,163,162,159];
 const IMPOSSIBLE_VISIT=[179,178,176,175,173,172,169,166,163];
 const val=d=>d.n*d.m;
 const lbl=d=>d.n===0?'Miss':d.n===25?(d.m===2?'Bull':'25'):(d.m===3?'T':d.m===2?'D':'S')+d.n;
 const isDouble=d=>d.m===2&&d.n>0; // D1–D20 og bull
 function parse(t){t=String(t).trim().toUpperCase();if(t==='BULL'||t==='DB'||t==='50')return {n:25,m:2};if(t==='25'||t==='SB')return {n:25,m:1};if(t==='MISS'||t==='0')return {n:0,m:0};
  const r=/^([SDT]?)(\d{1,2})$/.exec(t);if(!r)return null;const n=+r[2];if(n<1||n>20)return null;return {n,m:r[1]==='T'?3:r[1]==='D'?2:1}}
 // Én pil: returnerer ny rest, bust eller checkout
 function evalDart(rest,d){const nw=rest-val(d);if(nw<0||nw===1)return {bust:true,why:nw<0?'under 0':'rest 1'};if(nw===0)return isDouble(d)?{out:true,rest:0}:{bust:true,why:'ikke double'};return {rest:nw}}
 // Visit som total (0–180)
 function validTotal(t){return Number.isInteger(t)&&t>=0&&t<=180&&!IMPOSSIBLE_VISIT.includes(t)}
 function evalTotal(rest,t){const nw=rest-t;if(nw<0||nw===1)return {bust:true};if(nw===0)return {needsDouble:true};return {rest:nw}}
 // Checkout-motor: færrest pile, derefter foretrukne doubler og setup-pile
 const FIN=[20,16,18,10,12,8,14,4,6,2,19,17,15,13,11,9,7,5,3,1].map(n=>({n,m:2})).concat([{n:25,m:2}]);
 const SET=[...[20,19,18,17,16,15,14,13,12,11,10].map(n=>({n,m:3})),...Array.from({length:20},(_,i)=>({n:20-i,m:1})),{n:25,m:2},{n:25,m:1},...[9,8,7,6,5,4,3,2,1].map(n=>({n,m:3})),...Array.from({length:20},(_,i)=>({n:20-i,m:2}))];
 const TABLE={170:'T20 T20 Bull',167:'T20 T19 Bull',161:'T20 T17 Bull',160:'T20 T20 D20',141:'T20 T19 D12',140:'T20 T20 D10',121:'T20 T11 D14',120:'T20 S20 D20',100:'T20 D20',81:'T19 D12',60:'S20 D20',40:'D20',32:'D16',2:'D1'};
 const memo={};
 function solve(rest,left){let best=null;
  FIN.forEach((f,fi)=>{if(!best&&val(f)===rest)best={d:[f],s:3*fi,i:0}});
  if(!best&&left>=2)SET.forEach((a,si)=>FIN.forEach((f,fi)=>{if(val(a)+val(f)===rest){const sc=si+3*fi;if(!best||sc<best.s)best={d:[a,f],s:sc,i:si}}}));
  if(!best&&left>=3)for(let i=0;i<SET.length;i++){const va=val(SET[i]);if(va>=rest)continue;for(let j=i;j<SET.length;j++){const r=rest-va-val(SET[j]);if(r<2||r>50)continue;FIN.forEach((f,fi)=>{if(val(f)===r){const sc=i+j+3*fi;if(!best||sc<best.s||(sc===best.s&&i<best.i))best={d:[SET[i],SET[j],f],s:sc,i}}})}}
  return best}
 function checkout(rest,left=3){if(rest<2||rest>170||left<1)return null;const k=rest+'/'+left;if(k in memo)return memo[k];
  const b=solve(rest,Math.min(3,left));let r=b?b.d.map(lbl).join(' '):null;if(b&&TABLE[rest]&&TABLE[rest].split(' ').length===b.d.length)r=TABLE[rest];return memo[k]=r}
 function minDarts(rest){const c=checkout(rest,3);return c?c.split(' ').length:null}
 return {val,lbl,parse,isDouble,evalDart,validTotal,evalTotal,checkout,minDarts,isBogey:r=>BOGEY.includes(r),BOGEY,IMPOSSIBLE_VISIT}
})();

/* ---- DartGame: kobler Dart501 til kampen (legs, sets, spillere, historik) ---- */
function dartSideInit(s,start){return Object.assign(s,{score:start,dlegs:s.dlegs||0,dsets:s.dsets||0,dartsLeg:0,thrown:s.thrown||0,scored:s.scored||0,last:null,visits:s.visits||[]})}
function startDart(sides){const tms=sideTeams()||[],bo=+setup.dlegs||3,sb=+setup.dsets||0,start=501;
 S.game={id:uid(),mode:'dart',dir:'down',target:0,startLabel:start,startScore:start,kpad:'preset',rule:{kegler:false},elim:false,placed:0,loser:null,plog:[],
  dart:{variant:'501',start,bestOf:bo,legsToWin:Math.ceil(bo/2),setsBestOf:sb,setsToWin:sb?Math.ceil(sb/2):0,legNo:1,setNo:1,legStarter:0,visit:[],visitStart:start,inMode:(()=>{const c=dIn();return c[c.def]?c.def:(c.dart?'dart':'total')})(),mult:1,tot:'',legsLog:[]},
  sides:sides.map((p,i)=>dartSideInit({id:uid(),pids:p,teamId:tms[i]||null,sk:{},rounds:[],feed:[],cur:0},start)),turn:0,round:1,pending:[],entry:'',winner:null,over:false,reached:[],startedAt:Date.now()};
 S.replay=null;S.lastSetup=Object.assign({},setup,{sel:[...setup.sel],teams:[...(setup.teams||[])]});undo=[];prev={};
 logA('Startede kamp',S.game.sides.map(sideName).join(' mod ')+` (dart 501, bedst af ${bo} legs${sb?', bedst af '+sb+' sæt':''})`);save();tab='game';render()}
function dartReset(g){const D=g.dart;g.round=1;Object.assign(D,{legNo:1,setNo:1,legStarter:0,visit:[],visitStart:D.start,mult:1,tot:'',legsLog:[]});g.sides.forEach(s=>{s.dlegs=0;s.dsets=0;s.thrown=0;s.scored=0;s.visits=[];dartSideInit(s,D.start)})}
function dartEndVisit(g,kind,darts){const D=g.dart,s=g.sides[g.turn],labels=D.visit.map(Dart501.lbl);
 const n=darts||(kind==='out'?Math.max(1,D.visit.length):3),scored=kind==='bust'?0:D.visitStart-s.score;
 if(kind==='bust')s.score=D.visitStart;
 s.last=kind==='bust'?'Bust':scored;s.dartsLeg+=n;s.thrown+=n;s.scored+=scored;s.rounds.push(scored);
 s.visits.push({k:kind,v:scored,d:labels,n,at:Date.now(),leg:D.legNo});
 s.feed.push({t:kind==='bust'?'Bust':String(scored),c:kind==='bust'?'n':kind==='out'?'g':''});
 plogAdd(g,s,-scored,D.visitStart,s.score,{sc:scored,dart:labels.join(' '),bust:kind==='bust'});
 logA(kind==='bust'?'Bust':kind==='out'?'Checkout '+scored:'Registrerede visit '+scored,`${shooter(s).first}${labels.length?' ('+labels.join(' ')+')':''} · rest ${s.score}`);
 D.visit=[];D.mult=1;D.tot='';if(kind==='out'){s.cur=((s.cur||0)+1)%s.pids.length;return dartLegWon(g,s)}
 if(kind==='bust')toast('Bust – '+shooter(s).first+' står stadig på '+s.score);
 advanceTurn(g);D.visitStart=g.sides[g.turn].score;save();render()}
function dartLegWon(g,s){const D=g.dart,nine=D.start===501&&s.dartsLeg===9;s.dlegs++;
 D.legsLog.push({leg:D.legNo,set:D.setNo,winner:s.id,darts:s.dartsLeg,nine});
 if(nine){logA('NINE-DARTER!',sideName(s));s.feed.push({t:'9-darter!',c:'g'})}
 let match=false;
 if(s.dlegs>=D.legsToWin){if(D.setsToWin){s.dsets++;g.sides.forEach(x=>x.dlegs=0);if(s.dsets>=D.setsToWin)match=true;else D.setNo++}else match=true}
 if(match){endGame(g,s.id);if(nine)toast('🎯 NINE-DARTER! '+sideName(s)+' vinder kampen');save();render();return}
 D.legNo++;D.legStarter=(D.legStarter+1)%g.sides.length;g.round=1;setActive(g,D.legStarter);g.sides.forEach(x=>{x.score=D.start;x.dartsLeg=0;x.last=null});D.visitStart=D.start;
 toast(nine?`🎯 NINE-DARTER! ${sideName(s)} vinder leggen`:`${sideName(s)} vinder leg ${D.legNo-1} på ${s.dartsLeg||D.legsLog.slice(-1)[0].darts} pile`);save();render()}
function dartThrow(g,d){const D=g.dart,s=g.sides[g.turn];if(!d)return;pushUndo();if(!D.visit.length)D.visitStart=s.score;
 const r=Dart501.evalDart(s.score,d);D.visit.push(d);D.mult=1;
 if(r.bust)return dartEndVisit(g,'bust');
 s.score=r.rest;if(r.out)return dartEndVisit(g,'out');
 if(D.visit.length>=3)return dartEndVisit(g,'normal');save();render()}
function dartTotal(g,t){const D=g.dart,s=g.sides[g.turn];if(!Dart501.validTotal(t))return toast(t>180?'Højst 180 på én visit':t+' kan ikke kastes med 3 pile');
 D.visit=[];D.visitStart=s.score;const r=Dart501.evalTotal(s.score,t);
 if(r.needsDouble){const md=Dart501.minDarts(s.score);if(!md){D.tot='';save();render();return toast(`${s.score} kan ikke lukkes med 3 pile – tjek tallet`)}
  openModal(`<h2>Checkout på ${s.score}?</h2><p class="mut">Sidste pil skal være i en double eller bull. Hvor mange pile blev brugt?</p><div class="row" style="margin-top:14px">${[1,2,3].filter(n=>n>=md).map(n=>`<button class="btn pri" data-act="dco" data-v="${n}">Ja – ${n} ${n===1?'pil':'pile'}</button>`).join('')}<button class="btn danger" data-act="dco" data-v="bust">Nej – bust</button></div><div class="mact"><span class="sp"></span><button class="btn" data-act="close">Annuller</button></div>`);return}
 pushUndo();if(r.bust)return dartEndVisit(g,'bust');s.score=r.rest;dartEndVisit(g,'normal')}
const dIn=()=>Object.assign({dart:true,total:true,quick:true,def:'dart'},S.settings.dartInput||{});
function dMode(g){const c=dIn(),m=g.dart.inMode;if(m&&c[m])return m;return c[c.def]?c.def:(c.dart?'dart':'total')}

return `<section class="card"><h2>Dart – indtastning</h2><p class="mut">Slå de måder til, I vil bruge ved tavlen. Er begge indtastninger slået til, kan man skifte under kampen.</p>

const dAvg=s=>s.thrown?(s.scored/s.thrown*3).toFixed(1):'0.0';
function dartCoHTML(g,s,i){const D=g.dart,on=i===g.turn&&!g.over,left=on?3-D.visit.length:3;
 if(s.score>170||s.score<2)return '';if(Dart501.isBogey(s.score))return `<div class="dco bogey">Bogey – ${s.score} kan ikke lukkes på 3 pile</div>`;
 const co=Dart501.checkout(s.score,left);return co?`<div class="dco"><span>Checkout</span><b>${co}</b></div>`:`<div class="dco none">Ingen checkout med ${left} ${left===1?'pil':'pile'}</div>`}

return `<article class="side dart ${on?'on':''} ${g.over&&g.winner===s.id?'won':''}">${on?'<span class="turn">Kaster</span>':''}${g.over&&g.winner===s.id?'<span class="won-tag">Vinder</span>':''}
<div class="mdh">${s.teamId&&T(s.teamId)?tAvatar(T(s.teamId)):avatar(shooter(s))}<b>${esc(s.pids.length>1?shooter(s).first+' ('+sideName(s)+')':sideName(s))}</b>${D.legStarter===i&&!g.over?'<span class="starter" title="Starter denne leg">● start</span>':''}</div>
<div class="dleg">${D.setsToWin?`<span>Sæt <b>${s.dsets}</b></span>`:''}<span>Legs <b>${s.dlegs}</b></span></div>
<div class="score ${bump(s)}">${s.score}</div>${dartCoHTML(g,s,i)}
<div class="meta"><span>Sidste <b>${s.last==null?'–':s.last}</b></span><span>Pile <b>${s.dartsLeg}</b></span><span>Snit <b>${dAvg(s)}</b></span></div></article>`}
function dartPad(g){const D=g.dart,s=g.sides[g.turn],inm=dMode(g),cfg=dIn(),vs=D.visit.reduce((a,d)=>a+Dart501.val(d),0);
const top=`<div class="pscore"><span>${esc(shooter(s).first)} · rest</span><strong class="${bump(s)}">${s.score}</strong><small>${D.visit.length?'Denne visit: '+vs:'Leg '+D.legNo+(D.setsToWin?' · sæt '+D.setNo:'')+' · først til '+D.legsToWin}</small></div>`;
const mode=!(cfg.dart&&cfg.total)?'':`<div class="seg dmode"><button class="${inm==='dart'?'on':''}" data-act="dinm" data-v="dart">Pr. pil</button><button class="${inm==='total'?'on':''}" data-act="dinm" data-v="total">Total for visit</button></div>`;
let body;
if(g.over)body='';
else if(inm==='dart'){const m=D.mult||1,pre=m===3?'T':m===2?'D':'';
 body=`<div class="dslots">${[0,1,2].map(i=>`<span class="${D.visit[i]?'f':''}">${D.visit[i]?Dart501.lbl(D.visit[i]):'Pil '+(i+1)}</span>`).join('')}</div>
<div class="seg dmult">${[[1,'Single'],[2,'Double'],[3,'Triple']].map(([v,l])=>`<button class="${m===v?'on':''}" data-act="dmult" data-v="${v}">${l}</button>`).join('')}</div>
<div class="keys k5 dnums m${m}">${Array.from({length:20},(_,i)=>`<button data-act="dnum" data-v="${i+1}">${pre}${i+1}</button>`).join('')}</div>
<div class="keys k3 dspecial"><button data-act="dq" data-v="25">25</button><button class="bull" data-act="dq" data-v="Bull">Bull 50</button><button data-act="dq" data-v="Miss">Miss</button></div>

if(t.dataset&&t.dataset.ev){if(!isAdmin()){askPin();render();return}const e=EV();e[t.dataset.ev]=t.value;S.settings.event=e;logA('Ændrede dato/tid/sted',t.dataset.ev+': '+(t.value||'automatisk'));save();render();return}
if(t.dataset&&t.dataset.evshow){if(!isAdmin()){askPin();render();return}const e=EV();e.show[t.dataset.evshow]=t.checked;S.settings.event=e;logA('Visning på OBS',t.dataset.evshow+(t.checked?' til':' fra'));save();render();return}
if(t.dataset&&'tmlabel' in t.dataset){if(myRole==='display')return;TO().timer.label=t.value.trim();logA('Timer-tekst',t.value.trim()||'(ingen)');save();render();return}
if(t.dataset&&t.dataset.tset){if(myRole==='display'){render();return}const to=TO(),k=t.dataset.tset;to[k]=k==='feat'?+t.value:t.value;logA(k==='round'?'Skiftede runde':'Skiftede vist bord',k==='round'?t.value:tabName(+t.value));save();render();return}
if(t.dataset&&t.dataset.tcfg){if(!isAdmin()){askPin();render();return}const to=TO(),k=t.dataset.tcfg;
 if(k==='rounds'){const l=t.value.split('\n').map(x=>x.trim()).filter(Boolean);if(l.length)to.rounds=[...new Set(l)]}
 else if(k.startsWith('pts.'))to.pts[k.slice(4)]=+t.value||0;
 else if(k==='tables')to.tables=Math.min(20,Math.max(1,+t.value||10));
 else if(k==='target'||k==='start')to[k]=Math.max(0,+t.value||0);
 else to[k]=t.value;
 logA('Ændrede turneringsregler',k+': '+t.value.split('\n').join(', '));save();render();return}
if(t.dataset&&t.dataset.mf&&mEdit){const k=t.dataset.mf;mEdit[k]=k==='table'?(t.value?+t.value:null):t.value;return}
if(t.dataset&&t.dataset.mtable){if(myRole==='display'){render();return}const m=TO().matches.find(x=>x.id===t.dataset.mtable);if(m)moveMatch(m,t.value);return}
if(t.dataset&&t.dataset.vis){const[v,k]=t.dataset.vis.split(':');S.settings.vis=S.settings.vis||{};S.settings.vis[v]=Object.assign({},S.settings.vis[v]||{},{[k]:t.checked});logA('Ændrede visning',`${v}: ${k} ${t.checked?'til':'fra'}`);save();render();return}
if(t.dataset&&t.dataset.import&&t.files.length){const f=t.files[0];readImportFile(f).then(rows=>{imp=buildImport(rows,f.name);importModal()}).catch(err=>{imp=null;toast('Kunne ikke læse filen: '+err.message)});return}
if(t.dataset&&t.dataset.tourfile&&t.files.length){const f=t.files[0];f.text().then(tx=>{const d=JSON.parse(tx);ask(`Åbn "${d.name||f.name}"? Den nuværende turnering bliver erstattet.`,'Åbn turnering',()=>applyTournament(d))}).catch(()=>toast('Filen kunne ikke læses'));t.value='';return}
if(t.dataset&&t.dataset.adm&&S.game){const g=S.game;if(t.dataset.adm==='team'){const ti=+t.value;adm={gid:g.id,ti,pi:g.sides[ti].cur||0}}else{adm={gid:g.id,ti:adm&&adm.gid===g.id?adm.ti:g.turn,pi:+t.value}}render();return}
if(t.dataset&&t.dataset.brandup&&t.files.length){const f=t.files[0];if(!/\.(png|jpe?g|webp|svg)$/i.test(f.name)){toast('Brug png, svg, webp eller jpg');return}fetch('/api/branding?name='+encodeURIComponent(f.name),{method:'POST',body:f}).then(r=>r.json()).then(b=>{setBrand(b);logA('Udskiftede systemlogo',f.name);toast('Systemlogoet er opdateret på alle skærme');render()}).catch(()=>toast('Kunne ikke gemme logoet'));return}
if(t.dataset&&t.dataset.mup&&t.files.length){const [sp,c]=t.dataset.mup.split('/');mUpload([...t.files],sp,c);return}
if(t.dataset&&t.dataset.mrep&&t.files.length){const p=t.dataset.mrep.split('/');mUpload([t.files[0]],p[0],p[1],t.dataset.mrep);return}
if(t.dataset&&t.dataset.hf&&t.dataset.hf!=='q'){hfl[t.dataset.hf]=t.value;hfl.limit=100;render();return}
if(t.dataset&&t.dataset.set)logA('Ændrede indstilling',t.dataset.set==='adminPin'?'Admin-PIN':t.dataset.set+' = '+(t.dataset.set==='sponsors'?t.value.split('\n').filter(Boolean).join(', '):t.value));
if((t.id==='tphoto'||t.id==='mphoto')&&t.files[0]&&editing)readPhoto(t.files[0]).then(d=>{if(!editing)return;editing.photo=d;editing._img=true;const el=$(t.id==='tphoto'?'#tprev':'#mprev');if(el)el.innerHTML=t.id==='tphoto'?tAvatar(editing,'xl'):avatar(editing,'xl')}).catch(()=>toast('Billedet kunne ikke læses'))});
document.addEventListener('keydown',e=>{
if(MODE==='tv'&&e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.();return}
if(!$('#modal').hidden){if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.edit){e.preventDefault();editSave();return}if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='resname')act('resadd');if(e.key==='Enter'&&e.target.id==='pinval')act('pinok');if(e.key==='Enter'&&e.target.id==='limval')act('limok');return}
if(e.key==='Enter'&&e.target.id==='rcode'){act('rlogin');return}
if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.tmin){e.preventDefault();act('tmsetin',e.target.dataset.tmin);return}
if(e.key==='Enter'&&e.target.id==='pval'){e.preventDefault();act('pcust','1');return}
if(e.key==='Enter'&&e.target.id==='skval'){e.preventDefault();act('skc');return}
if(MODE||tab!=='game'||!S.game)return;
if(e.key==='Enter'&&e.target.id==='skval'){e.preventDefault();act('skc','1');return}
if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
const g=S.game,k=e.key;
if(k==='Enter'&&g.kpad==='num'&&g.entry&&g.mode!=='dart'&&g.mode!=='point'){e.preventDefault();act('kent')}
else if(k===' '||k==='Enter'){e.preventDefault();commit()}
else if(k==='Escape'){g.mode==='point'?undoPoint(g):doUndo()}
else if(g.mode==='dart'){if(dMode(g)==='total'){if(/^\d$/.test(k))act('dtd',k);else if(k==='Backspace')act('dtb')}else if(k==='Backspace')act('dback')}
else if(g.kpad==='num'&&/^\d$/.test(k)){act('dig',k)}
else if(g.kpad==='num'&&k==='-'){act('sign')}
else if(k==='Backspace'&&g.kpad==='num'){act('bk')}
else if(k==='+'){act('plus')}});
if(MODE==='tv')document.addEventListener('dblclick',()=>document.documentElement.requestFullscreen?.());

/* ---------- konto-synk & boot ---------- */
let mediaReadonly=false, cloudQuiet=false, cloudRev='', cloudTimer=null;
function bbHeaders(){
  const h={'content-type':'application/json'};
  try{const t=sessionStorage.getItem('grok-auth.bearer-token'); if(t) h.Authorization='Bearer '+t;}catch(e){}
  return h;
}
function slimForCloud(o){
  let s; try{s=JSON.stringify(o)}catch(e){return '{}'}
  if(s.length<900000) return s;
  let c; try{c=JSON.parse(s)}catch(e){return s.slice(0,900000)}
  const strip=p=>{if(p&&typeof p.photo==='string'&&p.photo.indexOf('data:')===0) p.photo=''};
  (c.players||[]).forEach(strip); (c.teams||[]).forEach(strip);
  if(c.settings&&c.settings.sponsorLogos){Object.keys(c.settings.sponsorLogos).forEach(k=>{const v=c.settings.sponsorLogos[k]; if(typeof v==='string'&&v.length>24000) delete c.settings.sponsorLogos[k]})}
  return JSON.stringify(c);
}
function scheduleCloud(){
  if(cloudQuiet||applying||!cloudRev&&!scheduleCloud.armed) return;
  scheduleCloud.pending=true;
  clearTimeout(scheduleCloud.t);
  scheduleCloud.t=setTimeout(()=>{scheduleCloud.pending=false; pushCloud()},650);
}
async function pushCloud(){
  if(cloudQuiet||!scheduleCloud.armed) return;
  try{
    const r=await fetch('/api/board/state',{method:'PUT',headers:bbHeaders(),credentials:'include',body:JSON.stringify({state:slimForCloud(S)})});
    if(r.status===401){location.replace('/login?next='+encodeURIComponent(location.pathname+location.hash));return}
    if(r.status===403){const j=await r.json().catch(()=>({}));document.body.innerHTML=boardDenied(j.error||'Du har ikke rettigheder til at tilgå scoreboardet.');scheduleCloud.armed=false;return}
    if(r.ok){const j=await r.json(); if(j.updatedAt) cloudRev=j.updatedAt}
  }catch(e){}
}
async function pullCloud(){
  if(scheduleCloud.pending||cloudQuiet||applying) return;
  try{
    const r=await fetch('/api/board/state',{headers:bbHeaders(),credentials:'include',cache:'no-store'});
    if(!r.ok) return;
    const j=await r.json();
    if(!j||!j.state||!j.updatedAt||j.updatedAt===cloudRev) return;
    cloudQuiet=true; applying=true;
    const parsed=typeof j.state==='string'?JSON.parse(j.state):j.state;
    S=bindTables(parsed);
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    cloudRev=j.updatedAt;
    applying=false; cloudQuiet=false;
    render();
  }catch(e){applying=false; cloudQuiet=false}
}
function paintShell(){
  if(MODE==='turnering')document.body.className='tm';
  else if(MODE==='tv')document.body.className='tv';
  else if(MODE.startsWith('overlay'))document.body.className='ov'+(MODE==='overlay-green'?' green':'');
  else if(MODE==='sponsor'||MODE==='sponsor-green')document.body.className='ov'+(MODE==='sponsor-green'?' green':'');
  else if(MODE==='mig'||MODE.startsWith('profil/'))document.body.className='phone';
  else if(isRemoteMode()){document.body.className='remote';const rc=MODE.split('/')[1];if(rc){setRemoteCode(decodeURIComponent(rc).toUpperCase());history.replaceState(null,'','#remote')}}
}
function boardDenied(text){
  return '<main style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px"><div><p style="letter-spacing:.18em;color:#EF4444;font-weight:800">ACCESS DENIED</p><h1>Du har ikke rettigheder til at tilgå scoreboardet.</h1><p class="mut">'+text+'</p><p style="margin-top:16px"><a href="/konto" style="color:#19C3FF">Til kontoen</a></p></div></main>';
}
function boardBlockReason(){
  const p=window.__bbPerms;
  if(!Array.isArray(p)) return '';
  const live=p.indexOf('USE_SCOREBOARD')>=0;
  const own=live||p.indexOf('VIEW_OWN_BOARD')>=0;
  if(!own) return 'Din rolle er gæst eller har ikke adgang til tavlen.';
  const display=MODE==='tv'||MODE.indexOf('overlay')===0||MODE==='sponsor'||MODE==='sponsor-green'||MODE==='turnering'||isRemoteMode();
  if(display && !live && p.indexOf('USE_REMOTE')<0) return 'Remote, TV og overlay kræver scoreboard-admin.';
  return '';
}
async function startApp(){
  const root=$('#root');
  if(root) root.innerHTML='<div style="display:grid;place-items:center;min-height:70vh;color:#94A3B8">Åbner scoreboard…</div>';
  const obsKey=new URLSearchParams(location.search).get('obs')||'';
  if(obsKey){
    if(!MODE || MODE==='overlay') MODE='overlay';
    if(TBL_ARG==null) TBL_ARG='1';
    window.__bbObs=true;
    window.__bbPerms=['USE_SCOREBOARD','VIEW_OWN_BOARD','USE_REMOTE'];
    scheduleCloud.armed=false;
    document.body.style.pointerEvents='none';
    let obsRev='';
    const pullObs=async()=>{
      const r=await fetch('/api/board/state?obs='+encodeURIComponent(obsKey),{cache:'no-store'});
      if(!r.ok) throw new Error('bad');
      const j=await r.json();
      if(j.updatedAt&&j.updatedAt===obsRev) return;
      obsRev=j.updatedAt||obsRev;
      if(j.state) S=bindTables(typeof j.state==='string'?JSON.parse(j.state):j.state);
      paintShell();
      render();
    };
    try{
      await pullObs();
      setInterval(()=>pullObs().catch(()=>{}),2000);
    }catch(e){
      document.body.innerHTML=boardDenied('OBS-linket er ugyldigt. Hent et nyt under Konto.');
    }
    return;
  }
  let me=null;
  try{const r=await fetch('/api/board/session',{headers:bbHeaders(),credentials:'include',cache:'no-store'}); if(r.ok) me=await r.json()}catch(e){}
  if(!me||!me.id){location.replace('/login?next='+encodeURIComponent(location.pathname+location.hash));return}
  if(me.active===false){
    document.body.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px"><div><img src="/branding/logo.png" alt="BanditBoard Live" style="height:72px;margin:0 auto 16px"><h1>Adgangen er lukket</h1><p class="mut">Kontakt BanditBoard, hvis scoreboardet skal åbnes igen.</p><p style="margin-top:16px"><a href="/" style="color:#19C3FF">Til forsiden</a></p></div></main>';
    return;
  }
  window.__bbPerms=Array.isArray(me.permissions)?me.permissions:[];
  const blocked=boardBlockReason();
  if(blocked){document.body.innerHTML=boardDenied(blocked);return}
  KEY='cueboard.v1.'+me.id;
  const local=bindTables(load());
  let remote=null, remoteAt='';
  try{
    const r=await fetch('/api/board/state',{headers:bbHeaders(),credentials:'include',cache:'no-store'});
    if(r.ok){const j=await r.json(); if(j&&j.state){remote=bindTables(typeof j.state==='string'?JSON.parse(j.state):j.state); remoteAt=j.updatedAt||''}}
  }catch(e){}
  const has=o=>!!(o&&((o.players&&o.players.length)||(o.history&&o.history.length)||(o.teams&&o.teams.length)||(o.tables||[]).some(t=>t.game)));
  if(remote&&(has(remote)||!has(local))){S=remote; cloudRev=remoteAt}
  else S=local;
  if(me.venueName&&(!S.settings.venue||S.settings.venue==='Min klub')) S.settings.venue=me.venueName;
  if(me.contactName&&!S.settings.operator) S.settings.operator=me.contactName;
  scheduleCloud.armed=true;
  const reload=()=>{if(sock&&sock.connected&&srvCore)return;const loc=S&&S.tables;S=bindTables(load());if(loc)S.tables=S.tables.map(t=>{const l=loc.find(x=>x.id===t.id);return l&&(l.rev||0)>(t.rev||0)?l:t});bumpTableRevs(false);render()};
  if(bc)bc.onmessage=reload;
  addEventListener('storage',e=>{if(e.key===KEY)reload()});
  paintShell();
  render();
  initSocket();
  if(MODE.startsWith('overlay'))setInterval(()=>{if(M().sponsors.length>6){ovPage++;render()}},8000);
  if(!remote&&has(S)) scheduleCloud();
  clearInterval(cloudTimer); cloudTimer=setInterval(pullCloud,3000);
  if(!MODE&&S.game&&!S.game.over)toast('Uafsluttet kamp gendannet');
}
addEventListener('hashchange',()=>location.reload());
startApp();

})();
</script>
